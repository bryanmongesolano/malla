name: Deploy — malla (main → 159.54.130.255:3009)

on:
  push:
    branches: [main, master]

jobs:
  build-and-push:
    # Runner nativo ARM64: la VM Oracle es arm64 — sin esto la imagen sale amd64-only
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bryanmongesolano/malla:${{ github.sha }}
            ghcr.io/bryanmongesolano/malla:kanso
            ghcr.io/bryanmongesolano/malla:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/kanso && chmod 600 ~/.ssh/kanso
          # Paquete GHCR privado: autentica el daemon de la VM con el GITHUB_TOKEN del job
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=no -i ~/.ssh/kanso ubuntu@159.54.130.255 \
            "docker login ghcr.io -u bryanmongesolano --password-stdin && \
             docker pull ghcr.io/bryanmongesolano/malla:kanso && \
             docker compose -f ~/kanso/apps/malla/docker-compose.yml up -d && \
             sleep 5 && curl -sf http://localhost:3009/api/health && echo ok-malla && docker logout ghcr.io"
