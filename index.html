<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Malla Curricular — CENFOTEC</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('malla_theme');
          var isDark = saved ? saved === 'dark' : true;
          var html = document.documentElement;
          var meta = document.getElementById('theme-color-meta');
          if (isDark) {
            html.classList.add('dark');
            if (meta) meta.setAttribute('content', '#020617');
          } else {
            html.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Prevent bounce scroll on mobile canvas and match iOS status bar background -->
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #020617;
      }
      body {
        background-color: #ffffff;
      }
      html.dark body {
        background-color: #020617;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
